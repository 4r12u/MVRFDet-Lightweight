[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvrfdet-lightweight"
version = "0.2.0"
description = "Lightweight reproduction/variant of MVRFDet for PyPI malicious package detection"
requires-python = ">=3.10"
dependencies = [
  "setuptools==80.10.2",
  "packaging>=23.2,<26",
  "python-scalpel==1.0b0",
  "graphviz~=0.17.0",
  "networkx==2.8.8",
  "numpy==1.26.4",
  "scikit-learn==1.4.2",
  "torch>=2.2,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
